<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Heroes Strategy Game</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            flex-direction: column;
            background-color: #f0f0f0;
        }
        body.active{
            background: lightgreen;
            background-size:93px 166px;
            
            background: url("dirt_sprite.png") -150px 0px repeat-x;
        }
        #game-container, #editor-container {
            display: none;
        }
        #game-container.active, #editor-container.active {
            display: block;
            padding: 50px;
        }
        canvas {
            border: 0px solid #333;
            background-color: #fff;
            overflow:auto;
        }
        #controls, #editor-controls {
            position:fixed;
            top: 10px;
            border: solid 1px black;
            background: white;
            padding: 2px;
            right: 1%;
        }
        #editor-controls {
            top:50px;
        }
        button {
            margin: 5px;
            padding: 2px;
            font-size: 16px;
            cursor: pointer;
        }
        select {
            padding: 5px;
            font-size: 16px;
        }
        #status {
            margin: 10px;
            font-size: 18px;
        }
        #status,
        #selected_status{
            position:fixed;
            border: solid 1px black;
            padding: 2px;
            top:70px;
            right:18%;
            background: rgba(255, 255, 255, 0.5);
        }
        #status{
            right:1%;
            width: 126px;
            top: 50px;
            background: rgba(255, 255, 255, 0.5);
        }
        #selected_status:empty {
          display: none;
        }
        #mode-controls{
            border: solid 1px black;
            position:fixed;
            display:inline-block;
            right:30%;
            background: white;
            padding: 2px;
        }
        li{
            list-style-type: none;
        }
        ul{
            padding:0;
            margin: 0;
        }
        h1{
            border: solid 1px black;
            position:fixed;
            margin: 0;
            display: inline-block;
            background: white;
            padding: 2px;
        }
        #castle_menu{
            display: none;
            position:absolute;
        }
        #overlay{
            display: block;
            position: absolute;
            width: 99%;
            height: 1000px;
            background: rgba(0, 0, 0, .7);
            color: white;
            font-size: 100px;
            text-align: center;
            padding-top: 30%;
        }
        </style>
    </head>
    <body>
        <div id="overlay"><p>TESTIN</p> <button onclick="this.parentNode.style.display = 'none'">OK</button></div>
        <canvas id="anime-canvas" width="150" height="200" style="position:absolute; left: 0; top: 0; display: none"></canvas>
        <h1>Heroes Strategy Game</h1> 
        <div id="mode-controls">
            <button onclick="switchMode('game')">Play Game</button>
            <button onclick="switchMode('editor')">Map Editor</button>
        </div>

               <div id="game-container">
            <div id="controls">
                <button onclick="endTurn()">End Turn</button>
                <button onclick="loadMap()">Load default Map</button>
            </div>
            <div id="status">Player 1's Turn, turnCount=0 Money:0 exp:0</div>
            <div id="selected_status"></div>
            <div id="castle_menu">
                    <button onclick="buy('knight')" >Knight 1000</button>
                    <button onclick="buy('archer')" >Archer 500</button>
                    <button onclick="buy('goblin')" >Goblin 700</button>
            </div>
            <canvas id="game-canvas" width="800" height="800"></canvas>
        </div>
        <div id="editor-container">
            <canvas id="editor-canvas" width="800" height="800"></canvas>
            <div id="editor-controls">
                <select id="terrain-type">
                    <option value="dirt">Dirt</option>
                    <option value="grass">Grass</option>
                    <option value="road">Road</option>
                    <option value="stoneroad">Stone Road</option>

                    <option value="lava">Lava</option>
                    <option value="ice">Ice</option>
                    <option value="forest">Forest</option>
                    <option value="mountain">Mountain</option>
                    <option value="water">Water</option>

                    <option value="castle">Castle</option>
                    <option value="well">Well</option>
                    <option value="goldmine">Gold mine</option>
                    <option value="shipyard">Shipyard</option>
                    <option value="bridge">Bridge</option>
                </select>
                <select id="unit-type">
                    <option value="none">None</option>
                    <option value="knight">Knight</option>
                    <option value="archer">Archer</option>
                    <option value="goblin">Goblin</option>

                    <option value="coin">Coin</option>
                </select>
                <select id="player-type">
                    <option value="0">No Player</option>
                    <option value="1">Player 1</option>
                    <option value="2">Player 2</option>
                </select>
                <br />
                <button onclick="saveMap()">Save Map</button>
                <button onclick="clearMap()">Clear Map</button>
                <button onclick="downloadMap()">Download Map</button>
                <br />
                <input type="file" name="file" onchange="readText(event)" />
            </div>
        </div>
        <a id="downloadAnchorElem" style="display:none"></a>
        <script src="script.js"></script>
    </body>
</html>
