<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Heroes Strategy Game</title>
        
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <style>
        body,button {
            font-family: fantasy, Arial, sans-serif;
            flex-direction: column;
            background-color: #f0f0f0;
            background-color: lightgreen;
        }
        body.active{
            background: lightgreen;
            background-size:93px 166px;
            background: url("dirt_sprite.png") -150px 0px repeat-x;
            background-blend-mode: multiply;
            background-color: teal;
        }
        #game-container{
            height: 90vh;
        }
        #game-container, #editor-container {
            display: none;
        }
        #game-container.active, #editor-container.active {
            display: block;
            padding-top: 57px;
            overflow: auto;
        }
        #editor-container, #editor-container.active {
            padding-top: 167px;
            height: 74vh;
        }
        canvas {
            border: 0px solid #333;
            background-color: #fff;
            overflow:auto;
        }
        #controls, #editor-controls {
            position:fixed;
            top: 10px;
            border: solid 1px black;
            background: green;
            right: 1%;
        }
        #editor-controls {
            top:0px;
        }
        #editor-container button:hover,
        #controls button:hover{
            color: lightgreen;
            background: black;
        }
        #editor-container button,
        #controls button{
            font-size: 30px;
            padding-top: 16px;
            line-height: 18px;
            margin: 0;
        }
        button {
            margin: 0px;
            padding: 2px;
            font-size: 16px;
            cursor: pointer;
        }
        #editor-container #editor-controls button{
            font-size:13px;
            padding: 5px;
            line-height: 15px;
            margin: 0;
        }
        select {
            padding: 5px;
            font-size: 16px;
        }
        #status,
        #selected_status{
            position:fixed;
            border: solid 1px black;
            padding: 2px;
            top:0px;
            right:18%;
            background: rgba(255, 255, 255, 0.7);
            background: rgba(200, 255, 150, 0.8);
            font-weight: 700;
            font-size: 18px;
        }
        #status{
            display:inline-block;
            position:relative;
            right:1%;
            width: 145px;
            top: 50px;
            background: rgba(255, 255, 255, 0.5);
            background: rgba(0, 255, 0, 0.7);
            font-weight: 700;
            right: auto;
            top: auto;
            font-size: 18px;
            height:24px;
            overflow: scroll;
        }
        #selected_status:empty {
            display: none;
        }
        #mode-controls{
            position:relative;
            display:inline-block;
            right:auto;
            background: green;
        }
        li{
            list-style-type: none;
            display: inline-block;
        }
        ul{
            padding:0;
            margin: 0;
        }
        h1{
            border: solid 1px black;
            position:fixed;
            margin: 0;
            display: inline-block;
            background: green;
            padding: 2px;
            padding-top: 15px;
            line-height: 30px;
            cursor: pointer;
        }
        #castle_menu{
            display: none;
            position:absolute;
        }
        #overlay p{
            margin-bottom: 0;
        }
        #overlay{
            display: block;
            position: absolute;
            width: 99%;
            height: 1000px;
            background: rgba(0, 0, 0, .7);
            color: white;
            font-size: 300%;
            text-align: center;
            padding-top: 25%;
            z-index: 1;
            height: 85vh;
        }
        #map_menu{

            position: absolute;
          margin: 10%;
          background: white;
          padding: 8%;
            font-size: 120%;
            width: 60%;
        }
        #map_menu:empty{
            display:none;
        }
        #map_menu p{ 
            display: inline-block;
            cursor: pointer;
        }
        #map_menu p.d{
            float:right;
        }
        button.show{
            position: absolute;
            top: 0;
            right:0;
            z-index:1;
        }
        </style>
    </head>
    <body>
        <div id="overlay"><p>Loading</p> <button onclick="this.parentNode.style.display = 'none'">OK</button></div>
        <canvas id="anime-canvas" width="150" height="200" style="position:absolute; left: 0; top: 0; display: none"></canvas>
        <h1 onclick="toggleMenu()">H 
                <div id="status" >Player 1, turn 0</div>
            <div id="menu" style="display: none;"> 
                <div id="mode-controls">
                    <button onclick="switchMode('game')">Play Game</button>
                    <button onclick="switchMode('editor')">Map Editor</button>
                    <button onclick="loadMap()">Load map</button>
                </div>
            </div>
        </h1> 
        <div id="map_menu"></div>

        <div id="game-container">
            <div id="controls">
                <button onclick="endTurn()">End Turn</button>
                <!--
-->
            </div>

            <div id="selected_status" onclick="this.innerHTML = '';"></div>
            <div id="castle_menu">
                <button onclick="buy('knight')" >Knight 1000</button>
                <button onclick="buy('archer')" >Archer 500</button>
                <button onclick="buy('goblin')" >Goblin 700</button>
                <button onclick="buy('dragon')" >Dragon 10000</button>
            </div>
            <canvas id="game-canvas" width="800" height="800"></canvas>
        </div>
        <div id="editor-container">
            <button class="show" onclick="toggleControls()">show</button>
            <div id="editor-controls">
                <input type="text" id="map_name" name="map_name" placeholder="Map name" /><br />
                <select id="terrain-type">
                    <option value="dirt">Dirt</option>
                    <option value="grass">Grass</option>
                    <option value="road">Road</option>
                    <option value="stoneroad">Stone Road</option>
                    <option value="desert">Desert</option>

                    <option value="lava">Lava</option>
                    <option value="ice">Ice</option>
                    <option value="forest">Forest</option>
                    <option value="mountain">Mountain</option>
                    <option value="water">Water</option>

                    <option value="castle">Castle</option>
                    <option value="well">Well</option>
                    <option value="goldmine">Gold mine</option>
                    <option value="tavern">Tavern</option>
                    <option value="bridge">Bridge</option>
                </select>
                <select id="unit-type">
                    <option value="none">None</option>
                    <option value="dragon">Dragon</option>
                    <option value="knight">Knight</option>
                    <option value="archer">Archer</option>
                    <option value="goblin">Goblin</option>

                    <option value="coin">Coin</option>
                </select>
                <select id="player-type">
                    <option value="0">No Player</option>
                    <option value="1">Player 1</option>
                    <option value="2">Player 2</option>
                </select>
                <br />
                <button onclick="saveMap()">Save Map</button>
                <button onclick="clearMap()">Clear Map</button>
                <button onclick="clearUnits()">Clear units</button>
                <button onclick="downloadMap()">Download Map</button>
                <br />
                <input type="file" name="file" onchange="readText(event)" />
            </div>
            <canvas id="editor-canvas" width="800" height="800"></canvas>
        </div>
        <a id="downloadAnchorElem" style="display:none"></a>
        <script src="script.js"></script>
    </body>
</html>
